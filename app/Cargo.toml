[package]
name = "omsi-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Omsi-Hub, the desktop app: its window (Tauri 2, stock), the page in ui/, and the commands that reach hub-api"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
hub-api = { workspace = true, features = ["native"] }
hub-core = { workspace = true, features = ["native"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# (the app's own updates: the signed release named in latest.json downloaded, installed, started; hub_api::update)
tauri-plugin-updater = "2.14"

# (the on-board computer's window: not activating, and the game's window found; src/boordcomputer.rs)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
