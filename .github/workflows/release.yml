# Omsi-Hub's releases: the installers for Windows, macOS (Apple silicon; Intel Macs no longer) and Linux,
# built by Tauri and put in a DRAFT release named after the version (`v<version>`) in this public
# repository, with its own token (the app's updater and the website read the releases here). Luc
# publishes the draft by hand (docs/UPDATES.md §5): a draft or a pre-release is never offered to
# players.
#
# A pre-release (for testers) is the same draft with GitHub's pre-release mark: run by hand with
# "pre-release" on (off by default since 1.0), or a tag whose version has a `-` in it. Published, it
# stays a pre-release: players download it themselves, and the app offers it to nobody.
#
# The updater files are signed and `latest.json` is attached only once the signing key is set up
# (the secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, and the public key
# in app/tauri.conf.json: docs/UPDATES.md "What Luc sets up"). Without them the installers are
# built all the same, and the app offers "Download from GitHub" instead of installing itself.
#
# The Mac app is signed with the Developer ID and notarised once the six APPLE_* secrets are set up
# (docs/UPDATES.md "Signing the Mac app"). Without them it is signed ad hoc, as CI's builds are.
#
# Runs on a pushed tag `v*` (the version in Cargo.toml and app/tauri.conf.json, checked), or by
# hand (Actions → Release → Run workflow). Run again, it uploads to the same draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "A pre-release (for testers; the app offers it to nobody)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # (the oldest Ubuntu we support: an AppImage runs on the same glibc or newer)
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      # (the toolchain rust-toolchain.toml pins, with the target the job builds for)
      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: ${{ matrix.target }}

      # (Luc's openOMSI fork, which Cargo fetches, is private: read with the secret FORKED_OPEN_OMSI when
      # there is one - a fine-grained token with "Contents: Read-only" on Luc-nbr/openOMSI -, else
      # from this repository's branch deps/openomsi, which holds the fork's pinned commit, with this
      # repository's own token)
      - name: Access to the openOMSI fork
        shell: bash
        env:
          TOKEN: ${{ secrets.FORKED_OPEN_OMSI }}
          OWN: ${{ github.token }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/Luc-nbr/openOMSI".insteadOf "https://github.com/Luc-nbr/openOMSI"
          else
            git config --global url."https://x-access-token:${OWN}@github.com/${GITHUB_REPOSITORY}.git".insteadOf "https://github.com/Luc-nbr/openOMSI"
          fi
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # (the version the release is named after, the same in Cargo.toml and tauri.conf.json, and
      # the tag's when a tag started it; whether it is a pre-release)
      - name: Version and kind
        id: kind
        shell: bash
        env:
          ASKED: ${{ inputs.prerelease }}
        run: |
          app=$(node -p "require('./app/tauri.conf.json').version")
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ "$app" != "$cargo" ]; then
            echo "::error::app/tauri.conf.json has $app, Cargo.toml has $cargo: make them the same"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$app, the version in Cargo.toml and app/tauri.conf.json"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then pre="$ASKED"; else case "$app" in *-*) pre=true ;; *) pre=false ;; esac; fi
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "::notice::Omsi-Hub $app, pre-release: $pre"
          # (an .rpm takes no `-` in its version: a version like 1.2.0-beta.2 gets the AppImage and the .deb only)
          case "$RUNNER_OS:$app" in
            Linux:*-*) echo "bundles=--bundles appimage,deb" >> "$GITHUB_OUTPUT"; echo "::notice::$app has a '-': no .rpm" ;;
            *) echo "bundles=" >> "$GITHUB_OUTPUT" ;;
          esac

      # (the updater files signed and latest.json attached only when the key is set up)
      - name: Updater signing set up?
        id: signing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ] && grep -q '"pubkey": *"[^"]' app/tauri.conf.json; then
            echo 'config=--config {"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_OUTPUT"
            echo "json=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No updater signing key yet: installers only, no latest.json (docs/UPDATES.md)."
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "json=false" >> "$GITHUB_OUTPUT"
          fi

      # (the Mac app signed with the Developer ID and notarised only when all its secrets are set up,
      # else ad hoc as before; on every system, as any job may be the one that writes the release's
      # text; Tauri reads the APPLE_* variables, and an empty one would count as set)
      - name: macOS signing set up?
        id: notary
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERTIFICATE$CERTIFICATE_PASSWORD$SIGNING_IDENTITY$API_ISSUER$API_KEY$API_KEY_P8" ]; then
            echo "::notice::No Developer ID yet: the Mac app is signed ad hoc, not notarised (docs/UPDATES.md)."
            echo "notarised=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CERTIFICATE" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$SIGNING_IDENTITY" ] || [ -z "$API_ISSUER" ] || [ -z "$API_KEY" ] || [ -z "$API_KEY_P8" ]; then
            echo "::error::Only some of the APPLE_* secrets are set: set all six (docs/UPDATES.md)."
            exit 1
          fi
          echo "notarised=true" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = "macOS" ]; then
            key="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
            printf '%s\n' "$API_KEY_P8" > "$key"
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          fi

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # (the tag, when the release makes it, on the commit built)
          releaseCommitish: ${{ github.sha }}
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: v__VERSION__
          releaseName: Omsi-Hub __VERSION__
          releaseBody: |
            ${{ steps.kind.outputs.prerelease == 'true' && '**A pre-release, for testing.** The app does not offer it as an update: install it yourself. Something wrong? Tell us at info@omsihub.com or with "Report a bug" on omsihub.com.' || '' }}

            Omsi-Hub __VERSION__: the add-on for openOMSI. More at [omsihub.com](https://omsihub.com).

            Needs openOMSI 0.2.22 or newer and an original OMSI 2. Omsi-Hub does not replace openOMSI: it builds on the openOMSI you have installed.

            - Windows: `Omsi-Hub_<version>_x64-setup.exe`
            - macOS: `Omsi-Hub_<version>_aarch64.dmg` (Apple silicon; Intel Macs are not built).${{ steps.notary.outputs.notarised != 'true' && ' The app is not notarised: the first time macOS says it cannot check it, choose Done, then System Settings › Privacy & Security › "Open Anyway".' || '' }}
            - Linux: `Omsi-Hub_<version>_amd64.AppImage` (updates itself), or the `.deb` / `.rpm`.
          releaseDraft: true
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          includeUpdaterJson: ${{ steps.signing.outputs.json == 'true' }}
          args: ${{ matrix.args }} ${{ steps.kind.outputs.bundles }} ${{ steps.signing.outputs.config }}
