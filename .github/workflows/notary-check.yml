# TEMPORARY (fix/macos-notary-key only, removed before the merge): checks the App Store Connect API
# key in the APPLE_* secrets on a Mac runner without building anything - the key written as Tauri
# reads it (.github/scripts/apple-api-key.sh) and Apple asked whether it accepts it.
name: Notary key check

on:
  push:
    branches: ["fix/macos-notary-key"]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The key, written and checked
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          bash .github/scripts/apple-api-key.sh "$key"
          echo "--- What kind of key (no contents):"
          openssl pkey -in "$key" -noout -text 2>/dev/null | head -1
          openssl asn1parse -in "$key" 2>/dev/null | grep -E "OBJECT|prim: (INTEGER|OCTET STRING)" | sed -E 's/\[HEX DUMP\]:.*/[...]/' | head -12
          echo "--- Apple's answer as it is:"
          xcrun notarytool history --key "$key" --key-id "$API_KEY" --issuer "$API_ISSUER" --output-format json > "$RUNNER_TEMP/a.json" 2>&1 && echo "accepted" || head -c 200 "$RUNNER_TEMP/a.json"
          echo
          echo "--- Re-encoded as PKCS#8 with a named curve:"
          openssl ec -in "$key" -param_enc named_curve -out "$RUNNER_TEMP/ec.pem" 2>/dev/null && openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/ec.pem" -out "$RUNNER_TEMP/AuthKey2.p8" && echo "re-encoded: $(grep -v -- ----- "$RUNNER_TEMP/AuthKey2.p8" | tr -d '\n' | wc -c | tr -d ' ') characters of key"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey2.p8" --key-id "$API_KEY" --issuer "$API_ISSUER" --output-format json > "$RUNNER_TEMP/b.json" 2>&1 && echo "accepted after re-encoding" || head -c 200 "$RUNNER_TEMP/b.json"
