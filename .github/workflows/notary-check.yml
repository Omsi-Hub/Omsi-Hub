# TEMPORARY (fix/macos-notary-key only, removed before the merge): which key in APPLE_API_KEY_P8 Apple takes.
name: Notary key check
on:
  push:
    branches: ["fix/macos-notary-key"]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash .github/scripts/apple-api-key.sh "$RUNNER_TEMP/AuthKey.p8"
