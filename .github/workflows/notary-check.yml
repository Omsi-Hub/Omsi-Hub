# TEMPORARY (fix/macos-notary-key only, removed before the merge): checks the App Store Connect API
# key in the APPLE_* secrets on a Mac runner without building anything - the key written as the
# release writes it (.github/scripts/apple-api-key.sh) and Apple asked whether it takes it.
name: Notary key check

on:
  push:
    branches: ["fix/macos-notary-key"]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The key, written and checked
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          bash .github/scripts/apple-api-key.sh "$key"
          xcrun notarytool history --key "$key" --key-id "$API_KEY" --issuer "$API_ISSUER" --output-format json > /dev/null
          echo "Apple takes the key the release will use."
