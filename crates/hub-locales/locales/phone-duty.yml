_version: 2
# The phone's Duty tab (plugin/phone_duty.lua).
"No trips yet: start your duty":
  nl: "Nog geen ritten: start je dienst"
  de: "Noch keine Fahrten: starte deinen Dienst"
  fr: "Pas encore de trajets : commencez votre service"
  ru: "Рейсов пока нет: начните смену"
  uk: "Рейсів ще немає: почніть зміну"
  pl: "Brak kursów: rozpocznij służbę"
"No duty: take one in the Omsi-Hub app":
  nl: "Geen dienst: neem er een in de Omsi-Hub app"
  de: "Kein Dienst: nimm einen in der Omsi-Hub-App"
  fr: "Aucun service : prenez-en un dans l’app Omsi-Hub"
  ru: "Нет смены: возьмите её в приложении Omsi-Hub"
  uk: "Немає зміни: візьміть її в застосунку Omsi-Hub"
  pl: "Brak służby: weź ją w aplikacji Omsi-Hub"
"Type the IBIS for me":
  nl: "Typ de IBIS voor mij in"
  de: "IBIS für mich eingeben"
  fr: "Saisir l’IBIS pour moi"
  ru: "Вводить IBIS за меня"
  uk: "Вводити IBIS за мене"
  pl: "Wpisuj IBIS za mnie"
"Swap which day?":
  nl: "Welke dag ruilen?"
  de: "Welchen Tag tauschen?"
  fr: "Échanger quel jour ?"
  ru: "Какой день поменять?"
  uk: "Який день обміняти?"
  pl: "Który dzień zamienić?"
"Leave on which day?":
  nl: "Verlof op welke dag?"
  de: "Urlaub an welchem Tag?"
  fr: "Congé quel jour ?"
  ru: "Отпуск в какой день?"
  uk: "Відпустка в який день?"
  pl: "Urlop w który dzień?"
"End the duty":
  nl: "Dienst beëindigen"
  de: "Dienst beenden"
  fr: "Terminer le service"
  ru: "Завершить смену"
  uk: "Завершити зміну"
  pl: "Zakończ służbę"
"End the duty now? The trip under way counts as not completed.":
  nl: "Dienst nu beëindigen? De rit die loopt telt als niet voltooid."
  de: "Dienst jetzt beenden? Die laufende Fahrt gilt als nicht beendet."
  fr: "Terminer le service maintenant ? Le trajet en cours compte comme non terminé."
  ru: "Завершить смену сейчас? Текущий рейс будет засчитан как незавершённый."
  uk: "Завершити зміну зараз? Поточний рейс зарахують як незавершений."
  pl: "Zakończyć służbę teraz? Bieżący kurs liczy się jako nieukończony."
"Call in sick for duty %{duty}? The company finds cover.":
  nl: "Ziek melden voor dienst %{duty}? Het bedrijf zoekt vervanging."
  de: "Für Dienst %{duty} krankmelden? Der Betrieb sucht Ersatz."
  fr: "Se déclarer malade pour le service %{duty} ? L’entreprise trouve un remplaçant."
  ru: "Сообщить о болезни на смену %{duty}? Компания найдёт замену."
  uk: "Повідомити про хворобу на зміну %{duty}? Компанія знайде заміну."
  pl: "Zgłosić chorobę na służbę %{duty}? Firma znajdzie zastępstwo."
"Ask to swap duty %{duty} on %{day}?":
  nl: "Ruil van dienst %{duty} op %{day} vragen?"
  de: "Tausch von Dienst %{duty} am %{day} anfragen?"
  fr: "Demander l’échange du service %{duty} le %{day} ?"
  ru: "Попросить обмен смены %{duty} на %{day}?"
  uk: "Попросити обмін зміни %{duty} на %{day}?"
  pl: "Poprosić o zamianę służby %{duty} w %{day}?"
"Ask for leave on %{day} (duty %{duty})?":
  nl: "Verlof aanvragen op %{day} (dienst %{duty})?"
  de: "Urlaub am %{day} beantragen (Dienst %{duty})?"
  fr: "Demander un congé le %{day} (service %{duty}) ?"
  ru: "Запросить отпуск на %{day} (смена %{duty})?"
  uk: "Попросити відпустку на %{day} (зміна %{duty})?"
  pl: "Poprosić o urlop w %{day} (służba %{duty})?"
"Ask to swap":
  nl: "Ruil vragen"
  de: "Tausch anfragen"
  fr: "Demander un échange"
  ru: "Попросить обмен"
  uk: "Попросити обмін"
  pl: "Poproś o zamianę"
"Leave request":
  nl: "Verlofaanvraag"
  de: "Urlaubsantrag"
  fr: "Demande de congé"
  ru: "Заявка на отпуск"
  uk: "Заява на відпустку"
  pl: "Wniosek urlopowy"
"Sent to the company":
  nl: "Naar het bedrijf gestuurd"
  de: "An den Betrieb gesendet"
  fr: "Envoyé à l’entreprise"
  ru: "Отправлено в компанию"
  uk: "Надіслано в компанію"
  pl: "Wysłano do firmy"
# The duty's lines in the pause menu (plugin/phone_menu.lua): 40 characters at most.
"Duty %{duty} • trip %{trip}/%{trips}":
  nl: "Dienst %{duty} • rit %{trip}/%{trips}"
  de: "Dienst %{duty} • Fahrt %{trip}/%{trips}"
  fr: "Service %{duty} • trajet %{trip}/%{trips}"
  ru: "Смена %{duty} • рейс %{trip}/%{trips}"
  uk: "Зміна %{duty} • рейс %{trip}/%{trips}"
  pl: "Służba %{duty} • kurs %{trip}/%{trips}"
"Message to control":
  nl: "Bericht aan de centrale"
  de: "Nachricht an die Leitstelle"
  fr: "Message au poste de contrôle"
  ru: "Сообщение диспетчеру"
  uk: "Повідомлення диспетчеру"
  pl: "Wiadomość do dyspozytorni"
"Choose again to end the duty":
  nl: "Kies nogmaals om de dienst te beëindigen"
  de: "Erneut wählen, um den Dienst zu beenden"
  fr: "Rechoisir pour terminer le service"
  ru: "Выберите снова, чтобы завершить смену"
  uk: "Виберіть знову, щоб завершити зміну"
  pl: "Wybierz ponownie, by zakończyć służbę"
"Choose “End the duty” in the menu again to end it":
  nl: "Kies „Dienst beëindigen” nogmaals in het menu om hem te beëindigen"
  de: "Wähle „Dienst beenden“ im Menü noch einmal, um ihn zu beenden"
  fr: "Choisissez à nouveau « Terminer le service » dans le menu pour le terminer"
  ru: "Выберите «Завершить смену» в меню ещё раз, чтобы завершить её"
  uk: "Виберіть «Завершити зміну» в меню ще раз, щоб завершити її"
  pl: "Wybierz ponownie „Zakończ służbę” w menu, aby ją zakończyć"
